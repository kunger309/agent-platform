user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 100m;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ========== 上游解析（容器动态 IP，必须运行时解析） ==========
    # 坑：命名 upstream 块（upstream xxx { server host:port; }）会在 nginx 启动时
    # 一次性解析 DNS 并【永久缓存 IP】。Docker 容器 rebuild 后会换 IP，网关却仍转发
    # 旧 IP → 502 Bad Gateway。本项目已踩过该坑（rebuild frontend 后整站 502）。
    # 改用「变量 + Docker 内置 DNS(127.0.0.11)」写法，让 nginx 每次请求重新解析，
    # 彻底规避「重建容器后网关 502」。valid=10s 控制缓存时长，ipv6=off 避免 AAAA 干扰。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ========== 主服务 ==========
    server {
        listen 80;
        server_name _;

        # 健康检查（无需鉴权）
        location = /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # 后端 API
        location /api/ {
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # SSE 长连接 + 流式响应：关闭缓冲
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
        }

        # SSE 端点（如 /api/chat-agent/stream 也走 /api/，已包含）

        # 前端静态资源 + SPA fallback
        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}