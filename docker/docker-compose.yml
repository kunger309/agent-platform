# ============================================================
# AI Agent Platform - Docker Compose
# 启动：docker compose -f docker/docker-compose.yml up -d
# ============================================================

# 注意：用户的 Windows 上已有 postgres(5432) 和 redis(6379) 作为系统服务在跑
# （PID 6776 / 5644），所以容器用高位端口 55432 / 6380 暴露到主机，避开冲突

services:
  # ========== 数据库：PostgreSQL 16 ==========
  postgres:
    image: postgres:16-alpine
    container_name: agent-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-net

  # ========== 缓存 / 队列：Redis 7 ==========
  redis:
    image: redis:7-alpine
    container_name: agent-platform-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - agent-net

  # ========== 向量库：Qdrant（默认） ==========
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent-platform-qdrant
    restart: unless-stopped
    ports:
      - "6334:6333"   # HTTP API
      - "6335:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant/config.yaml:/qdrant/config/config.yaml:ro
    healthcheck:
      # qdrant/qdrant:latest (Debian) 镜像不含 wget/curl，原健康检查恒失败 → 误报 unhealthy
      # 改用 bash 内置 /dev/tcp 真正探测 HTTP /readyz（仅依赖镜像内存在的 bash）
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/localhost/6333; printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; IFS= read -r line <&3; case \"$$line\" in *200*) exit 0;; *) exit 1;; esac'"
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - agent-net

  # ========== 后端：NestJS ==========
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: agent-platform-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: /api
      CORS_ORIGIN: http://localhost
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/agent_platform?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_URL: http://qdrant:6333
      VECTOR_STORE_PROVIDER: qdrant
      JWT_SECRET: ${JWT_SECRET:-please-change-me-to-a-32-char-random-secret-string}
      JWT_EXPIRES_IN: 7d
      # API Key 加密密钥（AES-256-GCM，32 字节 hex 即 64 字符）
      # 生成：openssl rand -hex 32
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-123456}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: 100
    volumes:
      - ../backend/uploads:/app/uploads
    healthcheck:
      # 显式走 127.0.0.1（IPv4），避免 alpine 的 wget 默认解析 localhost 到 ::1 导致误报
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - agent-net

  # ========== 前端：Vue3 + Nginx ==========
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: agent-platform-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - agent-net

  # ========== 网关：Nginx ==========
  nginx:
    image: nginx:alpine
    container_name: agent-platform-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - agent-net

# ========== 网络 ==========
networks:
  agent-net:
    driver: bridge

# ========== 卷 ==========
volumes:
  postgres_data:
  redis_data:
  qdrant_data: